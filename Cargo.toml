# crates/ 下的核心 crate 随对应任务陆续创建并登记到 members。

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
publish = false
authors = ["Pawork Contributors"]
# license 待定（首次实现提交前确定，见 README「许可证」）。

# 依赖选型基线（ROADMAP「依赖选型基线 · 直接采用」）。
# 版本为本阶段初始基线；各 crate 首次引用时按需 pin 到精确补丁版本并回填此处。
# 未被任何 crate 引用的依赖不会影响 cargo metadata / cargo build。
[workspace.dependencies]
# 异步运行时 / 序列化 / 错误
tokio = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
# 流式 / 字节处理（Provider 运行时与适配器）
futures = "0.3"
bytes = "1"

# 同步原语 / 安全临时文件
parking_lot = "0.12"
tempfile = "3"

# 标识 / 哈希 / 版本
blake3 = "1"
semver = { version = "1", features = ["serde"] }

# 平台原语（Unix 进程组信号）
libc = "0.2"

# 配置 / CLI
toml = "0.8"
clap = { version = "4", features = ["derive", "env"] }

# 结构化日志（redaction 规则自实现）
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# 存储（SQLite Event Store 绑定层，rusqlite 仅绑定，语义自实现）
rusqlite = { version = "0.32", features = ["bundled", "backup"] }

# HTTP / 网络（Provider 与 MCP Streamable HTTP）
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }

# 认证 / Secret / OAuth
keyring = "3"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
hmac = "0.13"
sha1 = "0.11"
url = "2"

# 受保护 Blob 加密（XChaCha20-Poly1305 AEAD + 密钥 zeroize）
chacha20poly1305 = "0.11.0"
zeroize = "1"

# 低可信度额度兜底的版本化 HTML 解析（仅 quota-service 使用）。
scraper = "0.27"

# 扩展机制（MCP / WASM）
rmcp = { version = "=2.2.0", default-features = false }
wasmtime = { version = "27", default-features = false, features = ["async", "component-model", "cranelift", "runtime", "wat"] }
wit-bindgen = "0.40"

# 文件遍历 / 搜索 / 正则 / 监听
ignore = "0.4"
globset = "0.4"
regex = "1"
notify = "7"
notify-debouncer-full = "0.5"

# 路径规范化 / 编码检测
dunce = "1"
chardetng = "0.1"
encoding_rs = "0.8"

# Token 计数 / TS 类型导出 / 系统目录
tiktoken-rs = "0.6"
ts-rs = { version = "11", features = ["serde-json-impl"] }
directories = "5"

# 平台沙箱 / 绑定
landlock = "0.4"
windows = "0.58"
windows-service = "0.7"

# PTY / 签名
portable-pty = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }

# 测试与基准（dev-dependencies 候选）
criterion = "0.5"
proptest = "1"
wiremock = "0.6"
insta = "1"
assert_cmd = "2"

# —— 构建缓存与 target/ 体积优化（详见 docs/quality/testing.md「Cargo Profile」）——
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = "full"
