[workspace]
resolver = "2"
# R1 波 E 定稿(ADR-039 D1):19 库平铺 crates/<短名>(目录去 pawork- 前缀,
# 包名不变)+ 2 应用 apps/{pawork,desktop};members 21。
members = [
    "crates/*",
    "apps/*",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
authors = ["Pawork Contributors"]
# license 待定（crates.io 发布硬前置，见 ROADMAP §4）。

[workspace.dependencies]
tokio = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = { version = "12", features = ["serde-json-impl"] }
bytes = "1"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json", "form"] }
toml = "1.1"
directories = "6"
dunce = "1"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
proptest = "1"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
landlock = "0.4"
windows = "0.61"
getrandom = "0.4"
sha2 = "0.11"
url = "2"
regex = "1"
wiremock = "0.6"
blake3 = "1"
chacha20poly1305 = "0.11.0"
zeroize = "1"
ignore = "0.4"
notify = "8"
