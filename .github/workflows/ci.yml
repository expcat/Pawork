name: CI

# 触发策略：默认所有 Actions 都不自动触发，只有在这里显式声明的触发器才会运行。
# 当前仅保留手动触发（workflow_dispatch）：在 GitHub 仓库的 Actions 页面点击
# "Run workflow"，或通过 gh workflow run / API 指定运行时才会执行。
#
# 如需对特定场景重新启用自动触发，在下方 `on:` 显式加回对应触发器，例如：
#   push:
#     branches: [main]
#   pull_request:
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Build & Lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo metadata
        shell: bash
        run: cargo metadata --no-deps --format-version 1 >/dev/null 2>&1
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo build
        run: cargo build --workspace --all-targets
      - name: cargo test
        run: cargo test --workspace
      - name: TypeScript schema drift check
        run: cargo run -p schema-typegen -- --check
