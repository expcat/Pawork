[package]
name = "protocol-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
authors.workspace = true
description = "Pawork GUI Connection Protocol 自检：--self-test 进程内 9 场景；--connect 外部握手"

[dependencies]
pawork-app = { path = "../../host/app" }
pawork-client = { path = "../../clients/gui-client" }
pawork-domain = { path = "../../foundation/domain" }
pawork-gui-server = { path = "../../host/gui-server" }
pawork-protocol = { path = "../../foundation/protocol" }
pawork-storage = { path = "../../foundation/sqlite", default-features = false, features = ["session"] }
pawork-testkit = { path = "../../foundation/testkit" }
pawork-transport = { path = "../../host/transport", features = ["local", "memory"] }
clap.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
