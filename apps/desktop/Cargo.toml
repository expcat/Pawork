[package]
name = "pawork-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
description = "Pawork GPUI Desktop Agent 壳：TaskRail + Timeline + Composer + Replay/Fork/Terminal（S10）"

[[bin]]
name = "pawork-desktop"
path = "src/main.rs"

[dependencies]
# 业务依赖唯一入口：pawork-client（re-export 协议/传输类型）。
pawork-client = { path = "../../crates/client" }
# UI / 运行时基建（ADR-035：gpui 精确锁定 0.2.2）。
gpui = "=0.2.2"
smol = "2"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
serde_json.workspace = true
unicode-segmentation = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# ADR-042：仅 Desktop 的原生 AX bridge；版本与 gpui 0.2.2 现有闭包对齐。
cocoa = "=0.26.0"
objc = "0.2"
raw-window-handle = "0.6"

[dev-dependencies]
# 仅 ui/barriers.rs 单测的临时目录（dev-dependencies 不计入生产 deny-list）。
tempfile.workspace = true
gpui = { version = "=0.2.2", features = ["test-support"] }
