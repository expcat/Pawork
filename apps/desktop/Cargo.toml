[package]
name = "pawork-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
description = "Pawork GPUI Desktop Agent 壳：TaskRail + Timeline + Composer + Replay/Fork/Terminal（S10）"

[[bin]]
name = "pawork-desktop"
path = "src/main.rs"

[dependencies]
# 业务依赖唯一入口：pawork-client（re-export 协议/传输类型）。
pawork-client = { path = "../../crates/client" }
# 终端显示核心（行缓冲解析 / 按键映射 / 尺寸估算）；纯库，不含连接与协议。
pawork-terminal = { path = "../../crates/terminal" }
# 系统 WebView 与受限 DOM 操作；不直接依赖 Core / Provider / 工具协议。
pawork-browser = { path = "../../crates/browser" }
# UI / 运行时基建（ADR-035：gpui 精确锁定 0.2.2）。
gpui = "=0.2.2"
smol = "2"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
serde_json.workspace = true
# CU-19：observation_image_read 的 Base64 块解码（纯工具库，不触碰
# pawork-* 依赖红线）。
base64 = "0.22"
# CU-19：观测截图入缓存前真实解码校验（gpui::Image 只包装字节不
# 解码；版本与 gpui 0.2.2 树内 image 0.25 对齐，不引入新传递依赖）。
image = "0.25"
unicode-segmentation = "1"
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
# ADR-042：仅 Desktop 的原生 AX bridge；版本与 gpui 0.2.2 现有闭包对齐。
cocoa = "=0.26.0"
objc = "0.2"

[dev-dependencies]
# 仅 ui/barriers.rs 单测的临时目录（dev-dependencies 不计入生产 deny-list）。
tempfile.workspace = true
gpui = { version = "=0.2.2", features = ["test-support"] }

[features]
# 默认关闭。只把 GUI4 的真实 PTY 集成测试编进 desktop 测试二进制。
gui4-pty = []
# 默认关闭。AC-05：临时账本经真实 Host 进入统计窗口。需要 PAWORK_UI_FIXTURE 指向以 ui-fixture feature 构建的 ui_fixture example，缺失即失败。
ac05-task-usage = []
