[package]
name = "pawork-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
description = "Pawork Rust Agent SDK：连接 pawork Host 的 client（不嵌入 Core）"

[features]
default = []

[dependencies]
pawork-domain = { path = "../../foundation/domain" }
pawork-protocol = { path = "../../foundation/protocol" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "process", "io-util", "sync", "macros", "time"] }

[dev-dependencies]
tempfile.workspace = true
