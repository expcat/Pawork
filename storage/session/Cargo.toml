[package]
name = "pawork-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
description = "Pawork Session Event Store、lifecycle/lease、分支 Fork 与可重建 Projection"

[features]
# V1 compaction-engine（engine/retention/snapshot）迁入，默认关闭。
# TokenEstimator 由调用方（engine 侧）实现并显式注入；本 crate 不依赖
# pawork-engine / 任何 context-engine 链。
compaction = []

[dependencies]
pawork-domain = { path = "../../foundation/domain" }
pawork-sqlite = { path = "../../foundation/sqlite" }
async-trait.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
blake3.workspace = true
tokio = { workspace = true, features = ["sync", "fs", "io-util", "macros"] }

[dev-dependencies]
pawork-protocol = { path = "../../foundation/protocol", default-features = false, features = ["adapter"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
