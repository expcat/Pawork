[package]
name = "pawork-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
description = "Pawork 共用的 HTTP 运行时与流式解析器"

[features]
default = ["parsers"]
# SSE / JSONL / partial-JSON；零重依赖（无 reqwest、无 pawork-api、无 pawork-domain）。
parsers = []
# HTTP 客户端 + 错误归一；打开 reqwest / bytes / futures / tokio / pawork-domain / pawork-api。
http = [
    "dep:bytes",
    "dep:futures",
    "dep:reqwest",
    "dep:tokio",
    "dep:pawork-domain",
    "dep:pawork-api",
]

[dependencies]
thiserror.workspace = true
serde_json.workspace = true
pawork-domain = { path = "../../foundation/domain", optional = true }
pawork-api = { path = "../../foundation/api", optional = true }
reqwest = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["sync", "time", "rt", "macros"] }

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
