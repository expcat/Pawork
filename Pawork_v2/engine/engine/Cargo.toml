[package]
name = "pawork-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
description = "Pawork Agent Engine（assemble_request + run_turn + 工具循环）"

[dependencies]
pawork-domain = { path = "../../foundation/domain" }
pawork-api = { path = "../../foundation/api" }
