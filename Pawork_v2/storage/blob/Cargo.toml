[package]
name = "pawork-blob-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
description = "Pawork 内容寻址 Artifact、Protected Blob（PWB1）与 Checkpoint 快照"

[features]
default = []
protected = ["dep:chacha20poly1305", "dep:rand", "dep:zeroize", "dep:pawork-domain"]
checkpoint = ["dep:serde_json", "dep:tokio", "dep:tracing"]

[dependencies]
pawork-sqlite = { path = "../../foundation/sqlite" }
pawork-domain = { path = "../../foundation/domain", optional = true }
blake3.workspace = true
rusqlite.workspace = true
serde.workspace = true
thiserror.workspace = true
chacha20poly1305 = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["fs", "io-util", "sync", "macros", "rt"] }
tracing = { workspace = true, optional = true }

[dev-dependencies]
blake3.workspace = true
chacha20poly1305.workspace = true
proptest.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
