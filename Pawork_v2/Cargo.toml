[workspace]
resolver = "2"
# Cargo 要求 glob 的父目录已存在；未激活域的 glob 随对应波次建目录后追加。
# 终局：foundation/* net/* providers/* storage/* workspace/* execution/*
#        vcs/* engine/* extensions/* workflow/* agents/* control-plane/*
#        host/* clients/* apps/*
members = [
    "foundation/*",
    "net/*",
    "providers/*",
    "storage/*",
    "workspace/*",
    "execution/*",
    "engine/*",
    "host/*",
    "apps/*",
]

# 未激活域只保留空目录占位（src/.gitkeep，untracked scaffold）；Cargo glob
# 命中无 manifest 的目录会报错，因此显式排除，激活对应 crate 时移除条目。
exclude = [
    "foundation/protocol",
    "storage/blob",
    "workspace/resources",
    "host/channels",
    "host/gui-server",
    "host/transport",
    "apps/protocol-probe",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
authors = ["Pawork Contributors"]
# license 待定（crates.io 发布硬前置，见 ROADMAP §4）。

[workspace.dependencies]
tokio = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = { version = "11", features = ["serde-json-impl"] }
bytes = "1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
toml = "0.8"
directories = "5"
dunce = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
proptest = "1"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
landlock = "0.4"
windows = "0.58"
keyring = "3"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
url = "2"
regex = "1"
wiremock = "0.6"
