# Pawork 配置样例。复制到全局配置目录或工作区 `.pawork/config.toml`：
#   Windows: %APPDATA%\dev\pawork\pawork\config.toml
#   macOS:   ~/Library/Application Support/dev.pawork.pawork/config.toml
#   Linux:   ~/.config/pawork/config.toml
#
# 不要把 API key 写进本文件（写了也会被忽略）。
# 凭证只走环境变量：PAWORK_API_KEY_<PROVIDER_ID 大写，- 变 _>
#   PowerShell: $env:PAWORK_API_KEY_GLM_CODING = "<key>"
#   PowerShell: $env:PAWORK_API_KEY_OPENCODE_GO = "<key>"
#   bash:       export PAWORK_API_KEY_GLM_CODING="<key>"

default_provider = "glm-coding"
default_model = "glm-5.2"

[[providers]]
id = "glm-coding"
base_url = "https://open.bigmodel.cn/api/coding/paas/v4"

# S2 第二协议通道（Anthropic Messages）。host 按 [provider_protocols] 选适配器。
[[providers]]
id = "glm-coding-anthropic"
base_url = "https://open.bigmodel.cn/api/anthropic"

[[providers]]
id = "opencode-go"
base_url = "https://opencode.ai/zen/go/v1"

# 落入 PaworkConfig.extra，不是 ProviderConfig 字段。engine 不读。
[provider_protocols]
glm-coding = "chat_completions"
glm-coding-anthropic = "messages"
opencode-go = "chat_completions"
