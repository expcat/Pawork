[package]
name = "pawork-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
description = "Pawork 内置只读工具与最小调度器"

[dependencies]
pawork-domain = { path = "../../foundation/domain" }
pawork-api = { path = "../../foundation/api" }
pawork-workspace = { path = "../../workspace/core" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
ignore = "0.4"
globset = "0.4"
regex = "1"
chardetng = "0.1"
encoding_rs = "0.8"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "rt-multi-thread", "sync", "time"] }
