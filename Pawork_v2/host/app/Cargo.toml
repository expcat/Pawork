[package]
name = "pawork-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
description = "Pawork 应用门面（配置装配 + session store + run_session / list_models）"

[dependencies]
pawork-domain = { path = "../../foundation/domain" }
pawork-api = { path = "../../foundation/api" }
pawork-config = { path = "../../foundation/config" }
pawork-engine = { path = "../../engine/engine" }
pawork-providers = { path = "../../providers/adapters", features = [
    "anthropic",
    "chatgpt-oauth",
    "xai-oauth",
    "glm-coding",
    "opencode-go",
    "qwen-token-plan",
    "deepseek",
] }
pawork-auth = { path = "../../providers/auth" }
pawork-session = { path = "../../storage/session", features = ["compaction"] }
pawork-tools = { path = "../../execution/tools" }
pawork-policy = { path = "../../execution/policy" }
pawork-provider-core = { path = "../../providers/core" }
pawork-workspace = { path = "../../workspace/core" }
async-trait.workspace = true
futures.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
reqwest.workspace = true

[dev-dependencies]
async-trait.workspace = true
tempfile.workspace = true
serde_json.workspace = true
pawork-api = { path = "../../foundation/api" }
pawork-domain = { path = "../../foundation/domain" }
pawork-engine = { path = "../../engine/engine" }
pawork-providers = { path = "../../providers/adapters", features = ["anthropic"] }
pawork-session = { path = "../../storage/session" }
pawork-testkit = { path = "../../foundation/testkit" }
