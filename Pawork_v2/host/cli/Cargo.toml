[package]
name = "pawork-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
description = "Pawork CLI（chat / sessions / run / models）"

[dependencies]
pawork-app = { path = "../app" }
pawork-api = { path = "../../foundation/api" }
pawork-domain = { path = "../../foundation/domain" }
pawork-engine = { path = "../../engine/engine" }
async-trait.workspace = true
clap.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "io-std", "io-util"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
