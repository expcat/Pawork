[package]
name = "pawork-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
description = "Pawork GPUI Desktop Agent 壳：Sessions 侧栏 + Timeline + Composer（S7 波 B 最小切片）"

[[bin]]
name = "pawork-desktop"
path = "src/main.rs"

[dependencies]
# 业务依赖唯一入口：pawork-client（re-export 协议/传输类型）。
pawork-client = { path = "../../clients/gui-client" }
# UI / 运行时基建（ADR-035：gpui 精确锁定 0.2.2）。
gpui = "=0.2.2"
smol = "2"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
serde_json.workspace = true
unicode-segmentation = "1"
