[package]
name = "remote-control-adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
description = "Pawork Mobile / Remote Control 受限通道（P17-12）：只读 + 受限写协议、配对/撤销、审批与通知推送"

# 依赖方向（plan/P17-12）：core-api → remote-control-adapter → transport 承载。
# 生产代码不依赖 gui-protocol（不消费、不取代 GUI Connection Protocol），
# 不依赖 agent-engine / provider-*（Remote 不改 Agent Core、不直连 Provider），
# 不依赖 session-store / app-database（不建第二事实源；读写一律经 app-service）。
# transport-remote 仅作为 dev-dependency 出现在承载集成测试中（P17-11 证据）。
[dependencies]
agent-domain = { path = "../agent-domain" }
app-service = { path = "../app-service" }
core-api = { path = "../core-api" }
rand.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
subscription-hub = { path = "../subscription-hub" }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing.workspace = true
transport-api = { path = "../transport-api" }

[dev-dependencies]
client-auth = { path = "../client-auth" }
provider-api = { path = "../provider-api" }
tempfile.workspace = true
test-support = { path = "../test-support" }
transport-memory = { path = "../transport-memory" }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
transport-remote = { path = "../transport-remote" }
