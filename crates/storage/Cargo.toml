[package]
name = "pawork-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
description = "Pawork 存储：串行 SQLite Actor、Session Event Store 与内容寻址 Blob"

[features]
default = ["session", "blob"]
session = [
    "dep:pawork-domain",
    "dep:async-trait",
    "dep:serde",
    "dep:serde_json",
    "dep:blake3",
    "tokio/fs",
    "tokio/io-util",
    "tokio/macros",
]
blob = ["dep:blake3", "dep:serde"]
compaction = ["session"]
checkpoint = [
    "blob",
    "dep:serde_json",
    "dep:tracing",
    "tokio/fs",
    "tokio/io-util",
    "tokio/macros",
    "tokio/rt",
]
protected = [
    "blob",
    "dep:chacha20poly1305",
    "dep:getrandom",
    "dep:zeroize",
    "dep:pawork-domain",
]

[dependencies]
rusqlite.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
pawork-domain = { path = "../domain", optional = true }
async-trait = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
blake3 = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
pawork-protocol = { path = "../protocol", default-features = false, features = ["adapter"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "rt-multi-thread"] }
blake3.workspace = true
chacha20poly1305.workspace = true
proptest.workspace = true
serde_json.workspace = true

[[test]]
name = "pwb1_golden"
required-features = ["protected"]

[[test]]
name = "read_range"
required-features = ["blob"]
