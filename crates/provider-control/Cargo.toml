[package]
name = "provider-control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
description = "Pawork 账号控制面：CredentialPool/Lease 与并发准入（P18-4 最小契约，供 Phase 12 编排消费）"

 [features]
# `account-control-v1`：版本化控制面类型、RoutingStrategy、ErrorClassifier、
# 版本化持久实体草案（ADR-033/P18-1）以及 P18-3 的 ProviderAccount/Credential
# 生命周期、tenant-scoped repository、secret resolver 与 Provider factory 组合点。
# 关闭时仅保留 legacy 单凭据回退路径与 P18-4 CredentialPool，保证旧数据库与未升级
# 部署可独立运行。默认开启以支持灰度与快速回退。启用时拉入 `provider-api`
# （CredentialResolver 返回 `provider_api::ResolvedCredential`、factory 返回
# `Arc<dyn ModelProvider>`；依赖方向 provider-control → provider-api → agent-domain）。
default = ["account-control-v1"]
account-control-v1 = ["dep:provider-api", "dep:provider-runtime", "dep:protected-blob-store"]

[dependencies]
agent-domain = { path = "../agent-domain" }
provider-api = { path = "../provider-api", optional = true }
protected-blob-store = { path = "../protected-blob-store", optional = true }
provider-runtime = { path = "../provider-runtime", optional = true }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "macros"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "rt-multi-thread"] }
proptest.workspace = true
