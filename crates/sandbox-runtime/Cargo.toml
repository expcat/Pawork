[package]
name = "sandbox-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
description = "Pawork Sandbox Runtime：在 process-runtime 之上叠加执行隔离（NativeRestricted 软沙箱 + 平台原生硬隔离后端）"

[dependencies]
agent-domain = { path = "../agent-domain" }
process-runtime = { path = "../process-runtime" }
policy-engine = { path = "../policy-engine" }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
# 结构化降级/回退日志：NativeRestricted 网络降级、bwrap/landlock/sandbox-exec 探测失败需可观测。
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }
tempfile = { workspace = true }

# Landlock 规则由 process-runtime 在 Linux pre_exec 边界实际施加；Windows 在
# AppContainer 受限令牌不可用时显式降级为可执行的 Job Object-only 后端。
