[package]
name = "pawork-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
description = "Pawork 应用门面（配置装配 + session store + run_session / list_models）"

[features]
default = []
# R1 UI fixture 仅供 example / 定向集成测试显式启用，不进入默认生产闭包。
ui-fixture = []
# 真实 API 冒烟默认不进死表编译；R10 复跑时显式启用（仍需 env 与 --ignored）。
live-smoke = []

[dependencies]
pawork-domain = { path = "../domain" }
pawork-engine = { path = "../engine" }
pawork-providers = { path = "../providers", features = [
    "anthropic",
    "chatgpt-oauth",
    "xai-oauth",
    "glm-coding",
    "opencode-go",
    "qwen-token-plan",
    "deepseek",
    "kimi-platform",
    "kimi-code",
] }
pawork-auth = { path = "../auth" }
pawork-tools = { path = "../tools" }
pawork-policy = { path = "../policy" }
pawork-workspace = { path = "../workspace" }
pawork-exec = { path = "../exec" }
pawork-storage = { path = "../storage", features = ["compaction", "checkpoint", "protected"] }
pawork-git = { path = "../git" }
pawork-workflow = { path = "../workflow" }
pawork-orchestration = { path = "../orchestration", default-features = false }
pawork-control-plane = { path = "../control-plane" }
pawork-protocol = { path = "../protocol" }
pawork-transport = { path = "../transport" }
tracing.workspace = true
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "fs", "sync", "time"] }
reqwest.workspace = true
toml.workspace = true
blake3.workspace = true
getrandom.workspace = true

[dev-dependencies]
async-trait.workspace = true
tempfile.workspace = true
serde_json.workspace = true
wiremock.workspace = true
pawork-domain = { path = "../domain" }
pawork-engine = { path = "../engine" }
pawork-providers = { path = "../providers", features = ["anthropic"] }
pawork-storage = { path = "../storage" }
pawork-testkit = { path = "../testkit" }
pawork-transport = { path = "../transport", features = ["local", "memory"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }

[[test]]
name = "gui_server_session"
path = "tests/gui_server/session.rs"

[[test]]
name = "gui_server_multi_gui_runtime"
path = "tests/gui_server/multi_gui_runtime.rs"

[[test]]
name = "ui_fixture_projection"
path = "tests/ui_fixture_projection.rs"
required-features = ["ui-fixture"]

[[test]]
name = "smoke"
path = "tests/smoke.rs"
required-features = ["live-smoke"]

[[example]]
name = "ui_fixture"
path = "examples/ui_fixture.rs"
required-features = ["ui-fixture"]
