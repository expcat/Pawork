[package]
name = "cli-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
description = "Pawork CLI 与 Core 的同进程装配点"

[dependencies]
agent-domain = { path = "../agent-domain" }
app-service = { path = "../app-service" }
cli-command = { path = "../cli-command" }
cli-renderer = { path = "../cli-renderer" }
core-api = { path = "../core-api" }
serde_json.workspace = true
subscription-hub = { path = "../subscription-hub" }
tokio = { workspace = true, features = ["signal", "time"] }
transport-remote-placeholder = { path = "../transport-remote-placeholder" }

[dev-dependencies]
clap.workspace = true
core-runtime = { path = "../core-runtime" }
serde_json.workspace = true
test-support = { path = "../test-support" }
tokio = { workspace = true, features = ["macros", "rt", "time"] }
transport-remote-placeholder = { path = "../transport-remote-placeholder" }
