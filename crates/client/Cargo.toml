[package]
name = "pawork-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
description = "Pawork GUI Connection Protocol typed 连接 SDK：握手、版本协商、Command/Query 往返、订阅、Snapshot/Resume 重连、Ack/Heartbeat"

[features]
default = []
# probe self-test 与真实进程 e2e 默认不进死表编译；R9/R10 复跑时显式启用对应 feature。
probe-self-test = []
spawn-e2e = []

[dependencies]
pawork-domain = { path = "../domain" }
pawork-protocol = { path = "../protocol" }
pawork-transport = { path = "../transport" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "process", "io-util", "sync", "macros", "time"] }

[dev-dependencies]
pawork-app = { path = "../app" }
pawork-storage = { path = "../storage", default-features = false, features = ["session"] }
pawork-testkit = { path = "../testkit" }
pawork-transport = { path = "../transport", features = ["local", "memory"] }
clap.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros", "time"] }

[[test]]
name = "contract"
path = "tests/contract.rs"

[[test]]
name = "client_tests"
path = "tests/client_tests.rs"

[[test]]
name = "spawn_e2e"
path = "tests/spawn_e2e.rs"
required-features = ["spawn-e2e"]

[[test]]
name = "probe"
path = "tests/probe.rs"
required-features = ["probe-self-test"]

[[example]]
name = "probe"
path = "examples/probe.rs"
