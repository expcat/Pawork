[package]
name = "pawork-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
description = "Pawork 内置只读/写工具、最小调度器与 MCP 客户端"

[dependencies]
pawork-domain = { path = "../domain" }
pawork-workspace = { path = "../workspace" }
pawork-policy = { path = "../policy" }
pawork-exec = { path = "../exec" }
pawork-auth = { path = "../auth" }
async-trait.workspace = true
reqwest.workspace = true
rmcp = { version = "=3.1.3", default-features = false, features = [
    "client",
    "reqwest",
    "transport-async-rw",
    "transport-streamable-http-client-reqwest",
] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
tracing.workspace = true
url.workspace = true
ignore.workspace = true
globset = "0.4"
regex.workspace = true
chardetng = "0.1"
# 非死依赖:chardetng `EncodingDetector::guess` 的返回类型是 `&\x27static encoding_rs::Encoding`,
# read_file.rs 的 `encoding.decode(...)` 方法解析要求 encoding_rs 为直接依赖(2026-08-18 R0 波 B 实证 E0599)。
encoding_rs = "0.8"

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
pawork-testkit = { path = "../testkit" }
rmcp = { version = "=3.1.3", default-features = false, features = [
    "server",
    "transport-async-rw",
] }
tokio = { workspace = true, features = [
    "fs",
    "io-util",
    "macros",
    "rt",
    "rt-multi-thread",
    "sync",
    "test-util",
    "time",
] }
wiremock.workspace = true
