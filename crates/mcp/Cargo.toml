[package]
name = "pawork-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
description = "Pawork MCP client and tool adapter"

[dependencies]
pawork-domain = { path = "../domain" }
pawork-tools = { path = "../tools" }
pawork-workspace = { path = "../workspace" }
pawork-exec = { path = "../exec" }
pawork-auth = { path = "../auth" }
async-trait.workspace = true
reqwest.workspace = true
rmcp = { version = "=3.1.3", default-features = false, features = [
    "client",
    "reqwest",
    "transport-async-rw",
    "transport-streamable-http-client-reqwest",
] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt", "sync", "time"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
rmcp = { version = "=3.1.3", default-features = false, features = [
    "server",
    "transport-async-rw",
] }
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "rt",
    "rt-multi-thread",
    "sync",
    "test-util",
    "time",
] }
wiremock.workspace = true
