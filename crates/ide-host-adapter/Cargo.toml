[package]
name = "ide-host-adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "P17-9 IDE Host Adapter：IDE 生命周期/诊断/交互桥接（经 Agent SDK / Headless 连接 pawork Host，不嵌入第二 Core）"

[dependencies]
agent-domain = { path = "../agent-domain" }
agent-sdk = { path = "../agent-sdk" }
