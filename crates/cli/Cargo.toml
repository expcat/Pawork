[package]
name = "pawork-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
description = "Pawork CLI（六运行模式 + 运维：chat/run/headless/acp/gui/service）"

[dependencies]
pawork-app = { path = "../app" }
pawork-client = { path = "../client" }
pawork-domain = { path = "../domain" }
pawork-engine = { path = "../engine" }
pawork-protocol = { path = "../protocol", features = ["adapter"] }
pawork-storage = { path = "../storage", default-features = false, features = ["session"] }
pawork-transport = { path = "../transport" }
async-trait.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "io-std", "io-util", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

[[test]]
name = "acp_fixtures"
path = "tests/fixtures.rs"

[[test]]
name = "acp_floor"
path = "tests/floor.rs"
