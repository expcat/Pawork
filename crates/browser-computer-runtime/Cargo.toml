[package]
name = "browser-computer-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
description = "Pawork Browser / Computer Runtime：统一能力 facade + 可替换后端（Local/Playwright/MCP/ProviderHosted），按 P15-1 执行位点分流（P17-10）"

[dependencies]
tool-api = { path = "../tool-api" }
agent-domain = { path = "../agent-domain" }
policy-engine = { path = "../policy-engine" }
sandbox-runtime = { path = "../sandbox-runtime" }
process-runtime = { path = "../process-runtime" }
artifact-store = { path = "../artifact-store" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

[dev-dependencies]
artifact-store = { path = "../artifact-store" }
process-runtime = { path = "../process-runtime" }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "sync"] }
tempfile.workspace = true
