[package]
name = "pawork-computer-use"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "Isolated virtual-desktop observation and input, independent of the Pawork host"

# objc 0.2 的 sel_impl!/class! 宏展开引用 cfg(feature = "cargo-clippy")；
# check-cfg 声明该已知值后不再触发警告，其余未知 cfg 照常告警。
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
image = { version = "=0.25.10", default-features = false, features = ["jpeg"] }

# CU-03 起库本体在 macOS 落地原生后端（src/macos.rs：应用/窗口发现、
# 窗口代际、受控启动；CU-04 起 ScreenCaptureKit 窗口截图，block 为其
# completion handler 所需），全部复用 workspace 已锁定版本。Linux 只为
# computer_guest 增加 zbus，macOS 依赖不会进入 Linux 构建。
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
core-foundation = "0.10"
core-graphics = { version = "0.24", features = ["elcapitan"] }
libc = "0.2"
block = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
# zbus 5.19 的 block_on 在 blocking-api 特性里。guest 用它驱动异步
# Connection 与 Proxy::call，并用 async-io::Timer 给同一次无障碍读取做截止；
# 不带 async-io 时 zbus 编不过传输层。这不是只调用 blocking Connection API。
zbus = { version = "=5.19.0", default-features = false, features = ["async-io", "blocking-api"] }
async-io = "2.3"
# CU-26 Wayland seat 客户端：SCM_RIGHTS 传 shm / keymap fd、memfd、
# SO_PEERCRED；复用 workspace 已锁定版本，不引入 libwayland。
libc = "0.2"

# 仅 macOS 人工探针 examples（非产品路径）使用；objc / core-foundation /
# core-graphics / libc / block 已由上方正式依赖覆盖。
[target.'cfg(target_os = "macos")'.dev-dependencies]
cocoa = "=0.26.0"

[[bin]]
name = "computer_guest"
path = "src/bin/computer_guest.rs"
