[package]
name = "pawork-computer-use"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "Isolated virtual-desktop observation and input, independent of the Pawork host"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
image = { version = "=0.25.10", default-features = false, features = ["jpeg"] }

[dev-dependencies]
serde_json = "1"

# 仅 macOS 人工探针 examples/macos_background_probe.rs 使用，全部复用
# workspace 已锁定版本；库本体不引入任何平台框架。
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc = "0.2"
block = "0.1"
cocoa = "=0.26.0"
core-foundation = "0.10"
core-graphics = { version = "0.24", features = ["elcapitan"] }
libc = "0.2"
