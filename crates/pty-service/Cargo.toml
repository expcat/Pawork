[package]
name = "pty-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
description = "Pawork PTY Service：集成终端会话（create/resize/write/output/exit/kill、重连快照、有界缓冲、归属与自动清理）"

[dependencies]
agent-domain = { path = "../agent-domain" }
process-runtime = { path = "../process-runtime" }
portable-pty = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading"] }
