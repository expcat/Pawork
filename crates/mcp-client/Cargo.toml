[package]
name = "mcp-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
description = "Pawork MCP client transports, capability bridge, policy, configuration, and OAuth"

[dependencies]
agent-domain = { path = "../agent-domain" }
auth-service = { path = "../auth-service" }
config-service = { path = "../config-service" }
policy-engine = { path = "../policy-engine" }
tool-api = { path = "../tool-api" }
tool-runtime = { path = "../tool-runtime" }
async-trait.workspace = true
reqwest.workspace = true
rmcp = { workspace = true, features = [
    "client",
    "reqwest",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "process",
    "rt",
    "sync",
    "time",
] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
rmcp = { workspace = true, features = ["macros", "server", "transport-async-rw"] }
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "sync",
    "test-util",
    "time",
] }
wiremock.workspace = true
