[package]
name = "pawork-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
description = "Pawork GUI 与 CLI/Core 宿主之间的连接协议帧"

[features]
default = ["adapter", "client-auth", "headless"]
adapter = ["dep:async-trait"]
client-auth = ["dep:getrandom"]
# stdio Handler 使用 async-trait；tokio 特征写在主依赖上，避免测试再开 feature。
headless = ["dep:async-trait"]
typegen = ["dep:ts-rs", "pawork-domain/typegen"]

[[bin]]
name = "pawork-protocol-typegen"
path = "src/bin/typegen.rs"
required-features = ["typegen"]

[dependencies]
pawork-domain = { path = "../domain" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ts-rs = { workspace = true, optional = true }
tokio = { workspace = true, features = ["io-util", "sync", "macros", "rt", "time"] }
async-trait = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
