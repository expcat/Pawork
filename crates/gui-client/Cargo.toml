[package]
name = "gui-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
description = "Pawork GUI Connection Protocol typed 连接 SDK：握手认证、版本协商、Command/Query 往返、订阅、Snapshot/Resume 重连、Artifact 分片读取、Ack/Heartbeat 与断开重连辅助"

[dependencies]
agent-domain = { path = "../agent-domain" }
