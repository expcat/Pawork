[package]
name = "git-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
description = "Pawork 系统 Git 封装：repo/status/stage/worktree/缓存，基于 process-runtime"

[dependencies]
agent-domain = { path = "../agent-domain" }
process-runtime = { path = "../process-runtime" }
workspace-service = { path = "../workspace-service" }
policy-engine = { path = "../policy-engine" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "macros", "rt", "time", "fs"] }
tracing.workspace = true
ignore.workspace = true
notify.workspace = true
notify-debouncer-full.workspace = true
parking_lot.workspace = true
dunce.workspace = true
tempfile.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "fs"] }
