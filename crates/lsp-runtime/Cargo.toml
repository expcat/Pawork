[package]
name = "lsp-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
agent-domain = { path = "../agent-domain" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sandbox-runtime = { path = "../sandbox-runtime" }
process-runtime = { path = "../process-runtime" }
resource-loader = { path = "../resource-loader" }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "rt", "sync", "time"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }

[features]
default = []
# 通过 in-memory duplex 提供 mock 语言服务与注入式 spawner，仅用于本 crate 的定向测试。
mock = []
