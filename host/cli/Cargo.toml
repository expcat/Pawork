[package]
name = "pawork-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
description = "Pawork CLI（六运行模式 + 运维：chat/run/headless/acp/gui/service）"

[dependencies]
pawork-app = { path = "../app" }
pawork-api = { path = "../../foundation/api" }
pawork-channels = { path = "../channels" }
pawork-client = { path = "../../clients/gui-client" }
pawork-domain = { path = "../../foundation/domain" }
pawork-engine = { path = "../../engine/engine" }
pawork-gui-server = { path = "../gui-server" }
pawork-protocol = { path = "../../foundation/protocol" }
pawork-session = { path = "../../storage/session" }
pawork-transport = { path = "../transport" }
async-trait.workspace = true
clap.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "io-std", "io-util", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
