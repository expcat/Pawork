[package]
name = "pawork-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
description = "Pawork 应用门面（配置装配 + session store + run_session / list_models）"

[dependencies]
pawork-domain = { path = "../../foundation/domain" }
pawork-engine = { path = "../../engine/engine" }
pawork-providers = { path = "../../providers/adapters", features = [
    "anthropic",
    "chatgpt-oauth",
    "xai-oauth",
    "glm-coding",
    "opencode-go",
    "qwen-token-plan",
    "deepseek",
] }
pawork-auth = { path = "../../providers/auth" }
pawork-tools = { path = "../../execution/tools" }
pawork-policy = { path = "../../execution/policy" }
pawork-workspace = { path = "../../workspace/core" }
pawork-exec = { path = "../../execution/exec" }
pawork-storage = { path = "../../foundation/sqlite", features = ["compaction", "checkpoint"] }
pawork-git = { path = "../../vcs/git" }
pawork-workflow = { path = "../../workflow/core" }
pawork-orchestration = { path = "../../agents/orchestration", default-features = false }
pawork-control-plane = { path = "../../control-plane/core" }
pawork-protocol = { path = "../../foundation/protocol" }
pawork-transport = { path = "../transport" }
tracing.workspace = true
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "fs", "sync", "time"] }
reqwest.workspace = true
toml.workspace = true

[dev-dependencies]
async-trait.workspace = true
tempfile.workspace = true
serde_json.workspace = true
wiremock.workspace = true
pawork-domain = { path = "../../foundation/domain" }
pawork-engine = { path = "../../engine/engine" }
pawork-providers = { path = "../../providers/adapters", features = ["anthropic"] }
pawork-storage = { path = "../../foundation/sqlite" }
pawork-testkit = { path = "../../foundation/testkit" }
pawork-transport = { path = "../transport", features = ["local", "memory"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }

[[test]]
name = "gui_server_session"
path = "tests/gui_server/session.rs"

[[test]]
name = "gui_server_multi_gui_runtime"
path = "tests/gui_server/multi_gui_runtime.rs"
