[package]
name = "pawork-channels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
description = "Pawork 外部通道：ACP 优先，其它 feature 随后按需"

[features]
default = ["acp"]
acp = []

[dependencies]
pawork-domain = { path = "../../foundation/domain" }
pawork-protocol = { path = "../../foundation/protocol", features = ["adapter"] }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
