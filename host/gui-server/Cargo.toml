[package]
name = "pawork-gui-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
description = "Pawork GUI 协议服务器（多客户端、共源 Replay、慢客户端隔离）"

[dependencies]
pawork-protocol = { path = "../../foundation/protocol" }
pawork-transport = { path = "../transport" }
pawork-domain = { path = "../../foundation/domain" }
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
async-trait.workspace = true
thiserror.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
pawork-transport = { path = "../transport", features = ["local", "memory"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
